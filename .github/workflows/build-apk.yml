name: Build Android APK Natively on GitHub Actions

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (Native Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Native Android Folder
        run: npx expo prebuild --platform android --clean

      - name: Build Release APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare APK Artifact
        run: |
          mkdir -p release_output
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release_output/KINI-Chat.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release_output/KINI-Chat.apk
          else
            find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} release_output/KINI-Chat.apk \;
          fi
          
          if [ ! -f "release_output/KINI-Chat.apk" ]; then
            echo "Error: APK build failed to output file!"
            exit 1
          fi
          echo "APK successfully built: $(ls -la release_output/KINI-Chat.apk)"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: release_output/KINI-Chat.apk
          tag_name: v1.0.${{ github.run_number }}
          name: KINI Chat v1.0.${{ github.run_number }} (Release APK)
          body: |
            🚀 **Phiên bản Release APK chuẩn sản xuất (Production)**
            - Build trực tiếp qua Native Gradle (`assembleRelease`).
            - Hoạt động mượt mà và tối ưu hóa đầy đủ cho Android!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}











