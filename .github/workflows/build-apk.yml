name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install EAS CLI Globally
      run: npm install -g --force eas-cli expo

    - name: Install Project Dependencies
      run: npm install

    - name: Build Android APK Locally
      run: |
        npx expo run:android --variant release || npx expo prebuild --platform android
        cd android && ./gradlew assembleRelease
        
    - name: Upload APK to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        files: android/app/build/outputs/apk/release/app-release.apk
        tag_name: v1.0.${{ github.run_number }}
        name: KINI Chat v1.0.${{ github.run_number }}
        body: 'Tự động tạo bản cập nhật APK mới nhất từ GitHub Actions.'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}






