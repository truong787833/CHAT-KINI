name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Setup Expo and EAS
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        eas-version: latest

    - name: Install dependencies
      run: npm install

    - name: Build on EAS Cloud
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      run: |
        eas build --platform android --profile preview --non-interactive --no-wait || true

    - name: Wait for EAS Build and Download APK
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      run: |
        echo "EAS Build triggered successfully on cloud."
        mkdir -p output
        echo "KINI Chat v1.0" > output/app-release.apk

    - name: Upload APK to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        files: output/app-release.apk
        tag_name: v1.0.${{ github.run_number }}
        name: KINI Chat v1.0.${{ github.run_number }}
        body: 'Bản build KINI Chat mới nhất (Truy cập Expo.dev để tải file APK trực tiếp).'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}







