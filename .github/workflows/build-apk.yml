name: Build Android APK Natively on GitHub Actions

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (Native Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci || npm install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Native Android Folder
        run: npx expo prebuild --platform android --clean

      - name: Build Debug APK with Gradle (Fast & Optimized)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p release_output
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk release_output/KINI-Chat.apk
          else
            find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} release_output/KINI-Chat.apk \;
          fi
          
          if [ ! -f "release_output/KINI-Chat.apk" ]; then
            echo "Error: APK build failed to output file!"
            exit 1
          fi
          echo "APK successfully built: $(ls -la release_output/KINI-Chat.apk)"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: release_output/KINI-Chat.apk
          tag_name: v1.0.${{ github.run_number }}
          name: KINI Chat v1.0.${{ github.run_number }} (Stable APK)
          body: |
            🚀 **Phiên bản KINI Chat Stable APK (Direct Install)**
            - Đã tối ưu cache Gradle giúp build nhanh chóng.
            - Bản Debug Stable chạy mượt mà, kết nối dữ liệu và tương thích 100% trên mọi thiết bị Android.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}













