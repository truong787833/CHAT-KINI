name: Build Android APK via EAS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Install and Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build on EAS and Download APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Starting synchronous EAS build..."
          npx eas build --platform android --profile preview --non-interactive --no-wait
          
          echo "Waiting for build to finish on Expo Cloud (checking every 30s)..."
          for i in {1..40}; do
            sleep 30
            
            # Lấy thông tin build dưới dạng text hoặc phân tích bằng node/python thay vì jq thuần để tránh lỗi module
            BUILD_JSON=$(eas build:list --platform android --limit 1 --json || echo "[]")
            BUILD_ID=$(node -e "const data = JSON.parse(process.argv[1]); console.log(data[0]?.id || '');" "$BUILD_JSON")
            STATUS=$(node -e "const data = JSON.parse(process.argv[1]); console.log(data[0]?.status || '');" "$BUILD_JSON")
            
            echo "Attempt $i: Build ID $BUILD_ID status is $STATUS"
            
            if [ "$STATUS" = "finished" ]; then
              BUILD_VIEW_JSON=$(eas build:view "$BUILD_ID" --json || echo "{}")
              ARTIFACT_URL=$(node -e "const data = JSON.parse(process.argv[1]); console.log(data.artifacts?.buildUrl || '');" "$BUILD_VIEW_JSON")
              
              if [ -n "$ARTIFACT_URL" ] && [ "$ARTIFACT_URL" != "null" ] && [ "$ARTIFACT_URL" != "undefined" ]; then
                echo "Downloading real APK from $ARTIFACT_URL..."
                mkdir -p release_output
                curl -L -o release_output/KINI-Chat.apk "$ARTIFACT_URL"
                break
              fi
            elif [ "$STATUS" = "errored" ] || [ "$STATUS" = "canceled" ]; then
              echo "Build failed with status $STATUS"
              exit 1
            fi
          done
          
          if [ ! -f "release_output/KINI-Chat.apk" ] || [ $(wc -c < "release_output/KINI-Chat.apk") -lt 1000 ]; then
            echo "Error: APK not downloaded or file too small!"
            exit 1
          fi

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: release_output/KINI-Chat.apk
          tag_name: v1.0.${{ github.run_number }}
          name: KINI Chat v1.0.${{ github.run_number }} (APK chính thức)
          body: |
            🚀 **Phiên bản APK đầy đủ (chính thức từ EAS Cloud)**
            - Tệp `.apk` thực sự (~80-90MB) đã được tải về từ Expo Cloud và đính kèm bên dưới. Bạn có thể cài đặt trực tiếp lên điện thoại Android!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}








